<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#26272b" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Bank Connected | NOHM</title>
  <link rel="preload" href="/fonts/sora/sora-latin-700-800.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/manrope/manrope-latin-400-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/type.css" />
  <link rel="stylesheet" href="/bar.css" />
  <style>
    html, body { margin: 0; background: #fff; }
    body { font-family: var(--font-text); -webkit-font-smoothing: antialiased; color: #000; }
    main { max-width: 420px; margin: 0 auto; padding: 18svh 24px 64px; text-align: center; }
    p.eyebrow { font-size: 12px; letter-spacing: .14em; color: #86868b; margin: 0 0 10px; font-weight: var(--weight-ui-strong); }
    h1 { font-size: clamp(30px, 7vw, 40px); line-height: 1.05; margin: 0; font-family: var(--font-display); font-weight: var(--weight-hero); letter-spacing: var(--tracking-headline); word-spacing: var(--word-spacing-headline); }
    p.body { font-size: 16px; line-height: 1.6; color: #6e6e73; margin: 14px 0 0; }
    a.btn { display: block; margin-top: 28px; padding: 14px 20px; border-radius: 4px; background: #e6e7e9; color: #171a20; text-decoration: none; font-weight: var(--weight-ui-strong); }
    .stores { display: flex; gap: 12px; margin-top: 14px; }
    .stores a { flex: 1; padding: 11px; border: 1px solid rgba(0,0,0,.12); border-radius: 4px; color: #000; font-size: 14px; text-decoration: none; font-weight: var(--weight-ui); }
    p.small { font-size: 14px; color: #86868b; margin-top: 28px; }
    p.small a { color: #356CA3; text-decoration: none; font-weight: var(--weight-ui); }
  </style>
</head>
<body>
  <header class="bar"><a href="/">NOHM</a></header>
  <main>
    <p class="eyebrow">BANK CONNECTED</p>
    <h1>You&rsquo;re ready to get paid.</h1>
    <p class="body">Your payout account is set up with Stripe. Return to the NOHM app and flip your availability to On Shift to start receiving jobs.</p>
    <a class="btn" href="nohm://contractor/home">Return to the NOHM app</a>
    <div class="stores">
      <a href="https://apps.apple.com/us/app/nohm-app/id6761128513">iPhone</a>
      <a href="https://play.google.com/store/apps/details?id=com.nohm.app">Android</a>
    </div>
    <p class="small">Need help? <a href="mailto:support@nohm.app">support@nohm.app</a></p>
  </main>
  <script src="/menu.js" defer></script>
</body>
</html>
