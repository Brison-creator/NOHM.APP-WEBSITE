<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
  <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
  <link rel="icon" type="image/png" href="/favicon-512.png" sizes="512x512" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Back from Stripe | NOHM</title>
  <link rel="preload" href="/fonts/sora/sora-latin-700-800.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/manrope/manrope-latin-400-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/type.css" />
  <link rel="stylesheet" href="/bar.css" />
  <link rel="stylesheet" href="/store-cta.css" />
  <style>
    html, body { margin: 0; background: #fff; }
    body { font-family: var(--font-text); -webkit-font-smoothing: antialiased; color: #000; }
    main { max-width: 420px; margin: 0 auto; padding: 18svh 24px 64px; text-align: center; }
    p.eyebrow { font-size: 12px; letter-spacing: .14em; color: #6e6e73; margin: 0 0 10px; font-weight: var(--weight-ui-strong); }
    h1 { font-size: clamp(30px, 7vw, 40px); line-height: 1.05; margin: 0; font-family: var(--font-display); font-weight: var(--weight-hero); letter-spacing: var(--tracking-headline); word-spacing: var(--word-spacing-headline); }
    p.body { font-size: 16px; line-height: 1.6; color: #6e6e73; margin: 14px 0 0; }
    a.btn { display: block; margin-top: 28px; padding: 14px 20px; border-radius: 4px; background: #356CA3; color: #fff; text-decoration: none; font-weight: var(--weight-ui-strong); }
    .store-cta { margin-top: 16px; }
    p.small { font-size: 14px; color: #6e6e73; margin-top: 16px; }
    p.small a { color: #356CA3; text-decoration: none; font-weight: var(--weight-ui); }
  </style>
</head>
<body>
  <header class="bar"><a href="/">NOHM</a></header>
  <main>
    <p class="eyebrow">STRIPE</p>
    <h1>Back from Stripe.</h1>
    <p class="body">Open the NOHM app to see your status. Stripe may still need a detail or two, and the app shows what&rsquo;s left. Started on nohm.app? Go back to that tab; it updates on its own.</p>
    <!-- Back into the app on the phone this was opened from (nohm://stripe-redirect brings NOHM forward and it checks Stripe again; owner, 2026-10-09). -->
    <a class="btn" href="nohm://stripe-redirect">Open the NOHM app</a>
    <div class="store-cta store-cta--center">
      <ul class="store-cta__badges">
        <li><a class="store-badge store-badge--app-store" href="https://apps.apple.com/us/app/nohm-app/id6761128513" aria-label="Download NOHM on the App Store"><img src="/img/badges/app-store.svg" width="144" height="48" alt="" /></a></li>
        <li><a class="store-badge store-badge--google-play" href="https://play.google.com/store/apps/details?id=com.nohm.app" aria-label="Get NOHM on Google Play"><img src="/img/badges/google-play.png" width="161" height="48" alt="" /></a></li>
      </ul>
    </div>
    <p class="small">Need help? <a href="mailto:support@nohm.app">support@nohm.app</a></p>
  </main>
  <script src="/menu.js" defer></script>
</body>
</html>
