<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Get the NOHM app | NOHM</title>
  <meta name="description" content="Get the NOHM app on the App Store or Google Play." />
  <!-- The business card's QR code (nohm.app/get?from=card): a phone goes
       straight to its store; anything else sees both badges. It only
       forwards, so it stays out of search and the sitemap. -->
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="icon" href="/favicon.ico?v=2" sizes="48x48" />
  <link rel="icon" type="image/png" href="/favicon-192.png" sizes="192x192" />
  <link rel="icon" type="image/png" href="/favicon-512.png" sizes="512x512" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <script>
    (function () {
      var ua = navigator.userAgent;
      // iPadOS reports a Mac; a touch screen gives it away.
      var ios = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      // A page's own badge names its store (?to=ios, ?to=android, ?to=business), so
      // each tap passes through here and is counted in the access logs; with no
      // ?to=, the phone picks.
      var to = (location.search.match(/[?&]to=(ios|android|business)(&|$)/) || [])[1];
      // An ad's utm_ tags go to Google Play as the install referrer: this link's
      // own, or the ones /menu.js kept from the visit's landing page.
      var tags = location.search.slice(1).split('&').filter(function (p) { return /^utm_(source|medium|campaign|content)=./.test(p); }).join('&');
      if (!tags) { try { tags = sessionStorage.getItem('nohm:utm') || ''; } catch (e) { tags = ''; } }
      if (to === 'business') location.replace('https://business.nohm.app/');
      else if (to === 'android' || (!to && /Android/i.test(ua))) location.replace('https://play.google.com/store/apps/details?id=com.nohm.app' + (tags ? '&referrer=' + encodeURIComponent(tags) : ''));
      else if (to === 'ios' || (!to && ios)) location.replace('https://apps.apple.com/us/app/nohm-app/id6761128513');
    })();
  </script>

  <link rel="preload" href="/fonts/manrope/manrope-latin-400-700.woff2" as="font" type="font/woff2" crossorigin />

    .get { max-width: 560px; margin: 0 auto; padding: 72px 16px 64px; text-align: center; }
    .get h1 { margin: 0; font-family: var(--font-display); font-weight: var(--weight-hero); font-size: clamp(36px, 6vw, 56px); line-height: 1.04; letter-spacing: var(--tracking-headline); }
    .get p { margin: 12px auto 24px; max-width: 420px; font-size: 18px; line-height: 1.5; color: #393c41; }
  </style>

        <li><a class="store-badge store-badge--google-play" href="https://play.google.com/store/apps/details?id=com.nohm.app" aria-label="Get NOHM on Google Play"><img src="/img/badges/google-play.png" width="161" height="48" alt="" /></a></li>
