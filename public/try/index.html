  <link rel="icon" type="image/png" href="/booth/icon-192.png" />
  <link rel="apple-touch-icon" href="/booth/apple-touch-icon.png" />
  <link rel="preload" href="/fonts/sora/sora-latin-700-800.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/manrope/manrope-latin-400-700.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/type.css" />
  <link rel="stylesheet" href="/how-it-works/demo.css" />
  <style>
    /* The QR code lands here: the app itself, edge to edge on a phone, no
       website around it. Wide screens get it in a phone frame. */
    html, body { height: 100%; }
    body { overscroll-behavior: none; }
    .try { height: 100svh; display: flex; align-items: center; justify-content: center; }
    .try .phone {
      width: 100%; height: 100svh; min-height: 0; max-height: none;
      border: 0; border-radius: 0;
    }
    .try .d-top { padding-top: max(10px, env(safe-area-inset-top)); }
    @media (min-width: 700px) {
      body { background: #f4f4f4; }
      .try .phone {
        width: 400px; height: min(820px, 94svh);
        border: 10px solid #171a20; border-radius: 48px; box-sizing: border-box;
      }
    }
  </style>
</head>
<body>
  <main class="try">
    <div class="phone">
      <div class="d-app" data-nohm-demo="try">
        <noscript><p class="d-pad">The demo needs JavaScript.</p></noscript>
      </div>
    </div>
  </main>
  <script src="/pricing.js"></script>
  <script src="/how-it-works/demo.js" defer></script>
</body>
</html>
