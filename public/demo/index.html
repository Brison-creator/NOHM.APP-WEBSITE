<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/demo/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="description" content="Try NOHM as a landlord. Everything on this page is made up, so tap anything.">
  <meta name="theme-color" content="#f7f8fa">
  <title>NOHM: See if you like it mode</title>
  <link rel="icon" type="image/png" href="/favicon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <style>
    html, body { margin: 0; height: 100%; background: #f7f8fa; }
    #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
      font: 600 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #6b7280; }
  </style>
</head>
<body>
  <div id="loading">Loading the demo…</div>
  <script>
    // What the site counts about this page (tools/ads/report.py reads these
    // as HEADs to /demo/ in the access logs, like /go/landlords' track.js):
    // opened, tapped something, and seconds on screen. No name, no id.
    (function () {
      var sent = {};
      function count(k) {
        if (sent[k]) return;
        sent[k] = 1;
        try { fetch('/demo/?' + k, { method: 'HEAD', cache: 'no-store', keepalive: true }).catch(function () {}); } catch (e) { /* not counted */ }
      }
      count('seen=hero');
      document.addEventListener('pointerdown', function () { count('seen=played'); }, { capture: true, passive: true });
      var STAYS = [10, 30, 60, 120, 300], shown = 0;
      var timer = setInterval(function () {
        if (document.hidden) return;
        shown += 1;
        if (STAYS.indexOf(shown) !== -1) count('stay=' + shown);
        if (shown >= 300) clearInterval(timer);
      }, 1000);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
