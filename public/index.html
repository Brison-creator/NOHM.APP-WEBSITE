<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NOHM</title>
  <meta name="description" content="It's always something. NOHM it." />
  <meta name="theme-color" content="#ffffff" />
  <link rel="preload" href="/fonts/onest-500.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    /* Onest (SIL Open Font License) — the closest free match to Tesla's
       Universal Sans, which is proprietary to Tesla. Self-hosted. */
    @font-face {
      font-family: "Onest";
      src: url("/fonts/onest-500.woff2") format("woff2");
      font-weight: 500;
      font-style: normal;
      font-display: swap;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #fff; }
    body {
      font-family: "Onest", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #171a20; /* Tesla's near-black */
    }
    main {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      /* Tesla puts the title in the upper third, not dead centre. */
      padding-top: 28svh;
      padding-left: 24px;
      padding-right: 24px;
    }
    h1 {
      margin: 0;
      /* Tesla sets titles at medium weight, not bold. */
      font-size: clamp(44px, 8vw, 84px);
      font-weight: 500;
      letter-spacing: -0.01em;
      line-height: 1.05;
    }
  </style>
</head>
<body>
  <main>
    <h1>NOHM it.</h1>
  </main>
</body>
</html>
