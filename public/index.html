<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NOHM</title>
  <meta name="description" content="It's always something. NOHM it." />
  <meta name="theme-color" content="#000000" />
  <!-- Panchang Semibold, the NOHM wordmark face. Free for commercial use under
       the ITF Free Font License, which forbids redistributing the files — so
       it loads from Fontshare rather than living in this public repo. -->
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=panchang@600,700&display=swap" />
  <link rel="stylesheet" href="/bar.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #fff; }
    body {
      font-family: "Panchang", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #171a20; /* Tesla's near-black */
    }
    main {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      /* Tesla puts the title in the upper third, not dead centre. */
      padding-top: 28svh;
      padding-left: 24px;
      padding-right: 24px;
    }
    /* On the homepage the bar floats over the hero so the title doesn't move. */
    .bar { position: fixed; left: 0; right: 0; }
    /* The setup line, set small in the sans like Tesla's subtitles, so the
       wordmark underneath lands as the answer. */
    .setup {
      margin: 0 0 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: clamp(15px, 1.6vw, 20px);
      font-weight: 500;
      color: #143f86;
      text-align: center;
    }
    /* Deep blue with a slow glint that sweeps across, then rests. Both ends of
       the gradient are the same dark blue, so the loop restarts seamlessly. */
    @supports ((-webkit-background-clip: text) or (background-clip: text)) {
      .setup {
        background: linear-gradient(100deg,
          #0f3272 0%, #143f86 30%, #2b5ba8 50%, #143f86 70%, #0f3272 100%);
        background-size: 250% 100%;
        background-position: 100% 0;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shine 9s ease-in-out infinite;
      }
    }
    @keyframes shine {
      0%        { background-position: 100% 0; }
      35%, 100% { background-position: 0 0; }
    }
    /* Screen two: the pro at the door. Words on white above, the photo full
       width below; the photo has no empty wall to write on. */
    .pro {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: #0f2346;
      text-align: center;
    }
    .pro .copy { padding: 88px 24px 36px; }
    .pro h2 {
      margin: 0;
      font-size: clamp(34px, 4.6vw, 72px);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.04;
    }
    .pro .sub {
      margin: 12px 0 0;
      font-size: clamp(19px, 1.9vw, 30px);
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .pro picture, .pro img { display: block; width: 100%; }
    .pro img { height: 62svh; object-fit: cover; object-position: 36% 40%; }
    @media (min-width: 900px) {
      .pro img { height: min(88svh, 66.7vw); object-position: 50% 35%; }
    }
    /* Screen three: the family. On a wide screen the words sit on the empty
       wall at the left of the photo, like the ad; on a phone they sit on
       white above it, because the photo is cropped to the family there. */
    .family {
      position: relative;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      color: #0f2346;
    }
    .family .copy { padding: 88px 24px 32px; text-align: center; }
    .family h2 {
      margin: 0;
      font-size: clamp(34px, 4.2vw, 64px);
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.04;
    }
    .family .sub {
      margin: 12px 0 26px;
      font-size: clamp(19px, 1.9vw, 30px);
      font-weight: 500;
      letter-spacing: -0.01em;
    }
    .family .cta {
      display: inline-block;
      min-width: 220px;
      padding: 15px 28px;
      border-radius: 6px;
      background: #0f2346;
      color: #fff;
      font-size: 17px; font-weight: 600;
      text-align: center;
      text-decoration: none;
    }
    .family .cta:hover { background: #356CA3; }
    .family .stores { margin: 14px 0 0; font-size: 14px; color: #393c41; }
    .family .stores a { color: #356CA3; font-weight: 600; text-decoration: none; }
    .family picture, .family img { display: block; width: 100%; }
    .family img { height: 62svh; object-fit: cover; object-position: 66% 50%; }
    @media (min-width: 900px) {
      /* Sized and placed like the ad, so the words fill the wall. */
      .family .copy {
        position: absolute; z-index: 1;
        left: 5%; top: 12%;
        width: 45%;
        padding: 0;
        text-align: left;
      }
      .family h2 { font-size: 5vw; }
      .family .sub { font-size: 2.3vw; margin: 0.6vw 0 2.2vw; }
      .family .cta { font-size: 1.45vw; padding: 1.25vw 2.6vw; min-width: 0; }
      .family .stores { font-size: max(13px, 0.95vw); }
      .family img { height: auto; aspect-ratio: 1672 / 941; }
    }
    footer {
      display: flex; justify-content: center; gap: 22px;
      padding: 28px 24px calc(28px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
    }
    footer, footer a { color: #86868b; text-decoration: none; }
    /* The wordmark sits still, lifted off the page by a soft contact shadow.
       The only movement is light: a faint reflection glides across it now
       and then, just after the glint crosses the line above, as if one light
       were passing over both. */
    .lift {
      position: relative;
      display: inline-block;
    }
    .ground {
      position: absolute;
      left: 12%; right: 12%;
      bottom: -0.55em;
      height: 0.22em;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(23, 26, 32, 0.20), rgba(23, 26, 32, 0));
      filter: blur(6px);
      pointer-events: none;
    }
    h1 {
      margin: 0;
      /* Panchang is a wide face, so it runs smaller than a normal sans would
         to fit a phone. */
      font-size: clamp(30px, 8.4vw, 88px);
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.05;
      white-space: nowrap;
      text-shadow:
        0 1px 0 rgba(23, 26, 32, 0.28),
        0 2px 1px rgba(23, 26, 32, 0.14),
        0 8px 18px rgba(23, 26, 32, 0.10);
    }
    @supports ((-webkit-background-clip: text) or (background-clip: text)) {
      h1 {
        background: linear-gradient(105deg,
          #171a20 0%, #171a20 40%, #50565f 50%, #171a20 60%, #171a20 100%);
        background-size: 300% 100%;
        background-position: 100% 0;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        /* text-shadow would paint over a clipped fill, so the depth moves to
           a filter on the glyphs instead. */
        text-shadow: none;
        filter:
          drop-shadow(0 1px 0 rgba(23, 26, 32, 0.28))
          drop-shadow(0 8px 14px rgba(23, 26, 32, 0.12));
        animation: shine 9s ease-in-out 0.6s infinite;
      }
    }
    @media (prefers-reduced-motion: reduce) {
      .setup, h1 { animation: none; }
    }
  </style>
</head>
<body>
  <header class="bar"><a href="/">NOHM</a></header>
  <main>
    <p class="setup">It&rsquo;s always something.</p>
    <div class="lift">
      <h1>NOHM it.</h1>
      <span class="ground" aria-hidden="true"></span>
    </div>
  </main>
  <section class="pro">
    <div class="copy">
      <h2>Need a home repair?</h2>
      <p class="sub">Find and book a local pro.</p>
    </div>
    <picture>
      <source type="image/webp" srcset="/img/pro-960.webp 960w, /img/pro-1536.webp 1536w" sizes="100vw" />
      <img src="/img/pro-1536.jpg" srcset="/img/pro-960.jpg 960w, /img/pro-1536.jpg 1536w" sizes="100vw"
           width="1536" height="1024" loading="lazy"
           alt="A Speedy Plumbing pro with a NOHM patch on his sleeve, smiling at a homeowner at her front door" />
    </picture>
  </section>
  <section class="family">
    <div class="copy">
      <h2>The future of<br />home services.</h2>
      <p class="sub">Home repair, handled.</p>
      <a class="cta" id="download" href="https://apps.apple.com/us/app/nohm-app/id6761128513">Download now</a>
      <p class="stores">
        <a href="https://apps.apple.com/us/app/nohm-app/id6761128513">App Store</a> &middot;
        <a href="https://play.google.com/store/apps/details?id=com.nohm.app">Google Play</a>
      </p>
    </div>
    <picture>
      <source type="image/webp" srcset="/img/family-960.webp 960w, /img/family-1672.webp 1672w" sizes="100vw" />
      <img src="/img/family-1672.jpg" srcset="/img/family-960.jpg 960w, /img/family-1672.jpg 1672w" sizes="100vw"
           width="1672" height="941" loading="lazy"
           alt="A family laughing over a board game in their living room" />
    </picture>
  </section>
  <script>
    // "Download now" goes to the right store for the phone in hand; iPhones
    // and computers get the App Store, which is the link's default.
    if (/android/i.test(navigator.userAgent)) {
      document.getElementById('download').href = 'https://play.google.com/store/apps/details?id=com.nohm.app';
    }
  </script>
  <footer>
    <span>NOHM &copy; 2026</span>
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
    <a href="/support">Support</a>
  </footer>
</body>
</html>
