<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>NOHM</title>
  <meta name="description" content="It's always something. NOHM it." />
  <meta name="theme-color" content="#ffffff" />
  <!-- Panchang Semibold, the NOHM wordmark face. Free for commercial use under
       the ITF Free Font License, which forbids redistributing the files — so
       it loads from Fontshare rather than living in this public repo. -->
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=panchang@600&display=swap" />
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #fff; }
    body {
      font-family: "Panchang", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: #171a20; /* Tesla's near-black */
    }
    main {
      min-height: 100svh;
      display: flex;
      justify-content: center;
      /* Tesla puts the title in the upper third, not dead centre. */
      padding-top: 28svh;
      padding-left: 24px;
      padding-right: 24px;
    }
    footer {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: flex; justify-content: center; gap: 22px;
      padding: 18px 24px calc(18px + env(safe-area-inset-bottom));
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      font-size: 12px;
    }
    footer a { color: #86868b; text-decoration: none; }
    /* The wordmark floats: a slow 7s drift of a few pixels, with a soft
       contact shadow underneath that tightens as the word rises. */
    .lift {
      position: relative;
      display: inline-block;
      animation: hover 7s ease-in-out infinite;
    }
    .ground {
      position: absolute;
      left: 12%; right: 12%;
      bottom: -0.55em;
      height: 0.22em;
      border-radius: 50%;
      background: radial-gradient(closest-side, rgba(23, 26, 32, 0.20), rgba(23, 26, 32, 0));
      filter: blur(6px);
      animation: ground 7s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes hover {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }
    @keyframes ground {
      0%, 100% { transform: translateY(0) scaleX(1);    opacity: 1; }
      50%      { transform: translateY(6px) scaleX(0.9); opacity: 0.65; }
    }
    @media (prefers-reduced-motion: reduce) {
      .lift, .ground { animation: none; }
    }
    h1 {
      margin: 0;
      /* Panchang is a wide face, so it runs smaller than a normal sans would
         to fit a phone. */
      font-size: clamp(30px, 8.4vw, 88px);
      font-weight: 600;
      letter-spacing: 0;
      line-height: 1.05;
      white-space: nowrap;
      text-shadow:
        0 1px 0 rgba(23, 26, 32, 0.28),
        0 2px 1px rgba(23, 26, 32, 0.14),
        0 8px 18px rgba(23, 26, 32, 0.10);
    }
  </style>
</head>
<body>
  <main>
    <div class="lift">
      <h1>NOHM it.</h1>
      <span class="ground" aria-hidden="true"></span>
    </div>
  </main>
  <footer>
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
    <a href="/support">Support</a>
  </footer>
</body>
</html>
